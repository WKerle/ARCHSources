<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX Viewer</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background: #fafafa;
    }
    table.dataTable {
      width: 100% !important;
    }
  </style>
</head>
<body>
  <h2>📚 BibTeX Viewer</h2>
  <p>Loading <code>references.bib</code> from repository...</p>
  <table id="bibTable" class="display nowrap" style="width:100%">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.colVis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bibtex-tidy@1.8.0/dist/bibtex-tidy.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bibtex-parse@2.0.1/dist/bibtexParse.min.js"></script>
  <script>
    async function loadBib() {
      try {
        const res = await fetch('references.bib');
        const text = await res.text();
        const parsed = BibtexParse.toJSON(text);
        if (!parsed.length) {
          document.body.innerHTML += "<p>No entries found in references.bib</p>";
          return;
        }
        const allFields = Array.from(new Set(parsed.flatMap(e => Object.keys(e.entryTags))));
        const headRow = document.getElementById('tableHead');
        headRow.innerHTML = "<th>Type</th><th>Citation Key</th>" +
          allFields.map(f => `<th>${f}</th>`).join("");
        const body = document.getElementById('tableBody');
        body.innerHTML = parsed.map(e => `
          <tr>
            <td>${e.entryType}</td>
            <td>${e.citationKey}</td>
            ${allFields.map(f => `<td>${e.entryTags[f] || ""}</td>`).join("")}
          </tr>
        `).join("");
        $('#bibTable').DataTable({
          dom: 'Bfrtip',
          buttons: ['colvis'],
          pageLength: 25,
          scrollX: true
        });
      } catch (err) {
        document.body.innerHTML += "<p>Error loading .bib file: " + err + "</p>";
      }
    }
    loadBib();
  </script>
</body>
</html>
