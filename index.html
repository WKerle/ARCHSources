<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX Viewer</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background: #fafafa;
    }
    h2 {
      margin-bottom: 1rem;
    }
    table.dataTable {
      width: 100% !important;
    }
    .dataTables_wrapper {
      overflow-x: auto;
    }
    /* Limit all columns to max 20% of viewport width */
    #bibTable th,
    #bibTable td {
      max-width: 20vw; /* 20% of viewport width */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Download button styling */
    .download-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }
    .download-btn:hover {
      background-color: #45a049;
    }
    /* Scrollable table container */
    .table-container {
      max-height: 75vh;
      overflow-y: auto;
    }
    /* Input field styling */
    .doi-input-container {
      margin-bottom: 1rem;
    }
    .doi-input {
      padding: 0.5rem;
      width: 60%;
      margin-right: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .doi-input:focus {
      border-color: #4CAF50;
    }
    .add-btn {
      background-color: #008CBA;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .add-btn:hover {
      background-color: #007B9E;
    }
  </style>
</head>
<body>
  <h2>📚 BibTeX Viewer</h2>
  <p>Loading <code>references.bib</code> from repository...</p>

  <div class="doi-input-container">
    <input type="text" id="doiInput" class="doi-input" placeholder="Enter DOI (e.g., 10.1000/xyz123)" />
    <button id="addBtn" class="add-btn">Add from DOI</button>
  </div>

  <div class="table-container">
    <table id="bibTable" class="display nowrap" style="width:100%">
      <thead>
        <tr>
          <th>Download</th>
          <th>Type</th>
          <th>DOI</th>
          <th>Author</th>
          <th>Year</th>
          <th>Title</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    let bibEntries = []; // Global array to store all entries

    async function loadBib() {
      try {
        const res = await fetch('references.bib');
        if (!res.ok) throw new Error(res.statusText);
        const text = await res.text();

        const entries = parseBibTeX(text);
        bibEntries = entries; // Store globally
        if (!entries.length) {
          document.body.innerHTML += "<p>No entries found in references.bib</p>";
          return;
        }

        const fieldsToShow = ["doi", "author", "year", "title"];
        const body = document.getElementById('tableBody');

        // Generate table rows with buttons referencing only the index
        body.innerHTML = entries.map((e, idx) => `
          <tr>
            <td><button class="download-btn" data-idx="${idx}">⬇️</button></td>
            <td>${e.type}</td>
            ${fieldsToShow.map(f => `<td>${(findField(e.fields, f) || "").replace(/\s+/g, " ")}</td>`).join("")}
          </tr>
        `).join("");

        // Initialize DataTable
        $('#bibTable').DataTable({
          paging: false,
          info: false,
          scrollY: "70vh",
          scrollCollapse: true,
          searching: true
        });

        // Attach download handlers
        document.querySelectorAll('.download-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = btn.getAttribute('data-idx');
            downloadBib(bibEntries[idx]);
          });
        });

      } catch (err) {
        document.body.innerHTML += "<p>Error loading .bib file: " + err + "</p>";
      }
    }

    function parseBibTeX(text) {
      const entries = [];
      const entryRegex = /@(\w+)\s*\{\s*([^,]+),([\s\S]*?)\n\}/g;
      let match;
      while ((match = entryRegex.exec(text)) !== null) {
        const type = match[1].trim();
        const key = match[2].trim();
        const body = match[3];
        const fields = {};
        const fieldRegex = /([\w\-]+)\s*=\s*\{([\s\S]*?)\}/g;
        let fmatch;
        while ((fmatch = fieldRegex.exec(body)) !== null) {
          fields[fmatch[1].trim().toLowerCase()] = fmatch[2].trim();
        }
        entries.push({ type, key, fields });
      }
      return entries;
    }

    function findField(fields, name) {
      const possible = Object.keys(fields).find(k => k.toLowerCase().includes(name.toLowerCase()));
      return possible ? fields[possible] : "";
    }

    function downloadBib(entry) {
      let bibContent = `@${entry.type}{${entry.key},\n`;
      for (const [k, v] of Object.entries(entry.fields)) {
        bibContent += `  ${k} = {${v}},\n`;
      }
      bibContent = bibContent.trim().replace(/,$/, '');
      bibContent += `\n}`;

      const blob = new Blob([bibContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${entry.key}.bib`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function addEntryFromDOI(doi) {
      try {
        const res = await fetch(`https://doi.org/${doi}`, {
          headers: { 'Accept': 'application/x-bibtex' }
        });

        if (!res.ok) throw new Error('DOI not found or invalid');

        const bibtex = await res.text();
        const entries = parseBibTeX(bibtex);
        if (entries.length === 0) throw new Error('No BibTeX entry found');

        const newEntry = entries[0];
        bibEntries.push(newEntry);
        const body = document.getElementById('tableBody');
        const idx = bibEntries.length - 1;
        body.innerHTML += `
          <tr>
            <td><button class="download-btn" data-idx="${idx}">⬇️</button></td>
            <td>${newEntry.type}</td>
            <td>${findField(newEntry.fields, 'doi')}</td>
            <td>${findField(newEntry.fields, 'author')}</td>
            <td>${findField(newEntry.fields, 'year')}</td>
            <td>${findField(newEntry.fields, 'title')}</td>
          </tr>
        `;

        // Reinitialize DataTable to include new row
        $('#bibTable').DataTable().destroy();
        $('#bibTable').DataTable({
          paging: false,
          info: false,
          scrollY: "70vh",
          scrollCollapse: true,
          searching: true
        });

        // Attach download handler to new button
        document.querySelectorAll('.download-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = btn.getAttribute('data-idx');
            downloadBib(bibEntries[idx]);
          });
        });

      } catch (err) {
        alert(`Error adding entry: ${err.message}`);
      }
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const doi = document.getElementById('doiInput').value.trim();
      if (doi) {
        addEntryFromDOI(doi);
        document.getElementById('doiInput').value = ''; // Clear input field
      } else {
        alert('Please enter a DOI.');
      }
    });

    loadBib();
  </script>
</body>
</html>
