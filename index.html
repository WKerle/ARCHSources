<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibTeX Viewer</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background: #fafafa;
    }

    h2 {
      margin-bottom: 1rem;
    }

    table.dataTable {
      width: 100% !important;
    }

    .dataTables_wrapper {
      overflow-x: auto;
    }

    /* Limit all columns to max 20% of viewport width */
    #bibTable th,
    #bibTable td {
      max-width: 20vw; /* 20% of viewport width */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Download button styling */
    .download-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .download-btn:hover {
      background-color: #45a049;
    }

    /* Scrollable table container */
    .table-container {
      max-height: 75vh;
      overflow-y: auto;
    }

    code {
      background-color: #eee;
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h2>📚 BibTeX Viewer</h2>
  <p>Loading <code>references.bib</code> from repository...</p>

  <div class="table-container">
    <table id="bibTable" class="display nowrap" style="width:100%">
      <thead>
        <tr>
          <th>Download</th>
          <th>Type</th>
          <th>DOI</th>
          <th>Author</th>
          <th>Year</th>
          <th>Title</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    async function loadBib() {
      try {
        const res = await fetch('references.bib');
        if (!res.ok) throw new Error(res.statusText);
        const text = await res.text();

        const entries = parseBibTeX(text);
        if (!entries.length) {
          document.body.innerHTML += "<p>No entries found in references.bib</p>";
          return;
        }

        const fieldsToShow = ["doi", "author", "year", "title"];
        const body = document.getElementById('tableBody');

        body.innerHTML = entries.map(e => `
          <tr>
            <td>
              <button class="download-btn" onclick='downloadBib(JSON.parse(decodeURIComponent("${encodeURIComponent(JSON.stringify(e))}")))'>⬇️</button>
            </td>
            <td>${e.type}</td>
            ${fieldsToShow.map(f => `<td>${(findField(e.fields, f) || "").replace(/\s+/g, " ")}</td>`).join("")}
          </tr>
        `).join("");

        $('#bibTable').DataTable({
          paging: false,
          info: false,
          scrollY: "70vh",
          scrollCollapse: true,
          searching: true
        });
      } catch (err) {
        document.body.innerHTML += "<p>Error loading .bib file: " + err + "</p>";
      }
    }

    function parseBibTeX(text) {
      const entries = [];
      const entryRegex = /@(\w+)\s*\{\s*([^,]+),([\s\S]*?)\n\}/g;
      let match;
      while ((match = entryRegex.exec(text)) !== null) {
        const type = match[1].trim();
        const key = match[2].trim();
        const body = match[3];
        const fields = {};
        const fieldRegex = /([\w\-]+)\s*=\s*\{([^}]*)\}/g;
        let fmatch;
        while ((fmatch = fieldRegex.exec(body)) !== null) {
          fields[fmatch[1].trim().toLowerCase()] = fmatch[2].trim();
        }
        entries.push({ type, key, fields });
      }
      return entries;
    }

    function findField(fields, name) {
      const possible = Object.keys(fields).find(k => k.toLowerCase().includes(name.toLowerCase()));
      return possible ? fields[possible] : "";
    }

    function downloadBib(entry) {
      let bibContent = `@${entry.type}{${entry.key},\n`;
      for (const [k, v] of Object.entries(entry.fields)) {
        bibContent += `  ${k} = {${v}},\n`;
      }
      bibContent = bibContent.trim().replace(/,$/, ''); // Remove last comma
      bibContent += `\n}`;

      const blob = new Blob([bibContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${entry.key}.bib`;
      a.click();
      URL.revokeObjectURL(url);
    }

    loadBib();
  </script>
</body>
</html>
